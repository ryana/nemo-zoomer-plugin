[project]
name = "nemo-zoomer-plugin"
description = "Zoomer semantic trace visualization for NeMo Platform and Studio."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi",
  "httpx",
  "nemo-platform-plugin>=0.3.0",
  "pydantic>=2.0.0",
]
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.entry-points."nemo.services"]
zoomer = "nemo_zoomer_plugin.service:ZoomerService"

[project.entry-points."nemo.studio"]
zoomer = "nemo_zoomer_plugin.studio:get_studio_spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_zoomer_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py312"
